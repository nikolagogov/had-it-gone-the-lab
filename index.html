<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>HAD IT GONE — THE LAB</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{
  color-scheme:dark;--bg:#090d18;--surface:#101827;--surface2:#151f31;--surface3:#1b2940;
  --line:#28364d;--line2:#3a4d69;--text:#edf3ff;--muted:#9aaac2;--faint:#71829d;
  --cyan:#6ee7f9;--blue:#8db7ff;--violet:#c4a7ff;--green:#8de7bd;--amber:#f5d28a;
  --shadow:0 20px 55px #0005;
}
*{box-sizing:border-box}
html{scroll-behavior:auto;height:100%;overflow:hidden}
body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;font-size:14px;line-height:1.45;height:100vh;min-height:0;overflow:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(ellipse at 15% -5%,#17436b55,transparent 38%),radial-gradient(ellipse at 95% 20%,#59357a2b,transparent 30%),linear-gradient(180deg,#0d1423 0,#090d18 65%)}
button{font:inherit}
.shell{max-width:1600px;height:100vh;min-height:0;margin:0 auto;padding:0 24px 14px;display:flex;flex-direction:column;overflow:hidden}
.topbar{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #26344a;gap:20px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-mark{width:34px;height:34px;border:1px solid #466887;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#19364b,#171c34);box-shadow:inset 0 1px #ffffff15;color:var(--cyan);font-size:20px}
.brand-title{font-weight:800;letter-spacing:.13em;font-size:12px;white-space:nowrap}
.brand-sub{display:none}
.status{display:flex;align-items:center;gap:8px;color:#b8c7dc;font:11px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px #8de7bd80}
.hero{flex:0 0 auto;padding:16px 0 14px;display:flex;justify-content:space-between;align-items:center;gap:24px}
.kicker{display:none}
h1{font-size:clamp(34px,4.5vw,54px);line-height:1.02;letter-spacing:-.065em;margin:0;font-weight:800}
h1 span{color:transparent;background:linear-gradient(90deg,#e8f6ff 0%,#8bdff7 45%,#b9a5ff 100%);background-clip:text}
.hero p{display:none}
.hero-chip{border:1px solid #304661;background:#111d2d;border-radius:12px;padding:12px 15px;min-width:155px;flex-shrink:0}
.hero-chip strong{display:block;font:20px 'DM Mono',monospace;color:var(--cyan)}
.hero-chip small{color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.workspace{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(340px,.75fr);gap:14px;align-items:stretch;overflow:hidden}
.panel{background:linear-gradient(145deg,#121c2bfa,#0f1725f5);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;min-width:0;min-height:0;display:flex;flex-direction:column}
.panel-head{flex:0 0 auto;padding:11px 15px;border-bottom:1px solid #26354a;display:flex;justify-content:space-between;align-items:center;gap:14px}
.panel-heading{display:flex;align-items:center;gap:11px}
.panel-icon{width:34px;height:34px;border-radius:10px;background:#1a2b40;border:1px solid #344d68;display:grid;place-items:center;color:var(--cyan);font-size:16px}
h2{margin:0;font-size:14px;letter-spacing:.01em;font-weight:800}
.panel-sub{color:var(--muted);font-size:11px;margin-top:3px}
.counter{font:10px 'DM Mono',monospace;color:var(--faint);white-space:nowrap}
.panel-body{padding:13px 15px 14px;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.section-label{font:10px 'DM Mono',monospace;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.elements{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.element{position:relative;overflow:hidden;border:1px solid #2b3c54;border-radius:12px;background:linear-gradient(145deg,#19263a,#121b2a);color:var(--text);text-align:left;padding:11px 10px 10px;cursor:pointer;min-height:128px;transition:border-color .18s,transform .18s,background .18s,box-shadow .18s}
.element:before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--element-color,#6ee7f9);opacity:.7}
.element:hover{transform:translateY(-2px);border-color:#58799c;background:linear-gradient(145deg,#20334b,#152238)}
.element.selected{border-color:var(--element-color,var(--cyan));box-shadow:0 0 0 1px var(--element-color,var(--cyan)),0 8px 24px #0003;background:linear-gradient(145deg,#20364b,#172337)}
.element .symbol{width:100%;height:68px;display:grid;place-items:center;border-radius:9px;background:radial-gradient(ellipse at center,#ffffff12,transparent 72%);border:1px solid #ffffff08;font-size:48px;line-height:1;margin-bottom:7px;filter:drop-shadow(0 4px 8px #0005)}
.element .name{display:block;font-size:12px;font-weight:800;letter-spacing:.01em}
.element .meta{display:block;color:var(--muted);font-size:10px;margin-top:3px;text-transform:capitalize}
.element .select-mark{position:absolute;right:10px;top:10px;color:var(--element-color,var(--cyan));font-size:11px;opacity:0}
.element.selected .select-mark{opacity:1}
.slots{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0 10px}
.slot{min-height:54px;border:1px dashed #35465d;border-radius:12px;background:#0d1522;padding:11px 13px;display:flex;align-items:center;gap:11px;color:var(--faint)}
.slot .slot-label{display:block;font:9px 'DM Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
.slot .slot-placeholder{font-size:11px}
.slot.filled{border-style:solid;border-color:#3c6582;background:linear-gradient(110deg,#132638,#111b2a);color:var(--text)}
.slot .slot-icon{font-size:25px}
.slot strong{font-size:12px}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{border:1px solid #34465e;border-radius:9px;padding:9px 13px;background:#1b293c;color:#d9e6f8;font-size:11px;font-weight:800;cursor:pointer;transition:.15s}
.btn:hover:not(:disabled){border-color:#6c8cad;background:#243a52}
.btn.primary{background:linear-gradient(100deg,#087c9e,#375db5);border-color:#2788b5;color:white;box-shadow:0 4px 16px #0e749033}
.btn.primary:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.result{flex:1 1 auto;min-height:105px;margin-top:12px;border:1px solid #2b3c53;border-radius:14px;min-height:160px;overflow:hidden;background:linear-gradient(140deg,#111d2d,#0e1624)}
.result-top{padding:17px 17px 14px;display:flex;gap:13px;align-items:flex-start}
.result-icon{width:48px;height:48px;flex-shrink:0;border-radius:13px;display:grid;place-items:center;font-size:27px;background:linear-gradient(145deg,#243c54,#1a2540);border:1px solid #3b5573}
.result-title{font-size:21px;line-height:1.2;letter-spacing:-.035em;font-weight:800;margin:2px 0 6px}
.pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{display:inline-block;border:1px solid #344c67;border-radius:99px;padding:3px 8px;font:9px 'DM Mono',monospace;letter-spacing:.04em;text-transform:uppercase;color:#b8d5f3}
.pill.game{border-color:#66508b;color:#d4c0ff}.pill.conditional{border-color:#79633c;color:var(--amber)}
.result-content{padding:0 17px 16px}
.reason{color:#c7d4e7;font-size:12px;margin:8px 0 0}
.reason strong{color:#f1f6ff}
.property-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px}
.property{background:#1b2b40;border:1px solid #293e57;border-radius:6px;padding:3px 7px;font:10px 'DM Mono',monospace;color:#c8d9ee}
.result-note{border-top:1px solid #26364b;background:#0d1521;padding:10px 17px;color:var(--muted);font-size:10px}
.empty-result{padding:24px 18px;color:var(--muted);font-size:12px}
.empty-result .big{display:block;font-size:24px;margin-bottom:7px}
.panel + .panel .panel-body{padding-top:15px}
.recipe-list{display:grid;gap:7px;min-height:0;flex:1 1 auto;overflow:auto;padding-right:3px}
.recipe{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid #26364b;background:#121d2b;border-radius:9px;padding:7px 9px;transition:.15s}
.recipe:hover{border-color:#506b8a;background:#18263a}
.recipe button{min-width:0;flex:1;background:transparent;border:0;color:var(--text);text-align:left;padding:0;cursor:pointer}
.recipe strong{display:block;font-size:11px;font-weight:800}
.recipe small{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.recipe .out{color:var(--green);font-size:10px;font-weight:800;text-align:right;white-space:nowrap}
.recipe .arrow{color:#617c9c;margin:0 4px}
.rule-note{flex:0 0 auto;margin-top:10px;border:1px solid #2b3c52;background:#101a28;border-radius:11px;padding:12px}
.rule-note h3{font-size:11px;margin:0 0 7px;color:#d8e6f7}
.rule-note ul{padding-left:16px;margin:0;color:var(--muted);font-size:10px}
.rule-note li+li{margin-top:4px}
.history-wrap{flex:0 0 auto;margin-top:13px;max-height:112px;overflow:hidden}
.history-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.history{display:grid;gap:4px;max-height:78px;overflow:auto;padding-right:3px}
.history-item{display:flex;gap:10px;align-items:center;border-left:2px solid #466d91;background:#101a28;border-radius:0 7px 7px 0;padding:7px 9px;color:#aabbd0;font-size:10px}
.history-index{font:10px 'DM Mono',monospace;color:#607d9d}
.footer{flex:0 0 auto;display:flex;justify-content:space-between;gap:15px;padding:8px 2px 0;color:#64758d;font:9px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
@media(max-width:980px){.shell{padding:0 14px 8px}.hero{padding:14px 0 12px}.hero p{font-size:12px}.workspace{grid-template-columns:minmax(0,1fr) minmax(290px,.8fr)}.elements{grid-template-columns:repeat(2,minmax(0,1fr))}.element{min-height:76px}.recipe-list{min-height:0}.rule-note{display:none}.panel-body{padding:10px}.result-content{padding-bottom:10px}.history-wrap{max-height:90px}.history{max-height:55px}}
@media(max-width:620px){.shell{padding:0 9px 6px}.topbar{padding:7px 0}.brand-mark{width:29px;height:29px}.brand-title{font-size:10px}.brand-sub{display:none}.status{display:none}.hero{padding:8px 0;display:block}.hero h1{font-size:29px;margin:0}.hero p{display:none}.hero-chip{display:none}.kicker{display:none}.workspace{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1.2fr) minmax(0,.8fr);gap:8px}.panel-head{padding:8px 10px}.panel-icon{width:27px;height:27px}.panel-sub{display:none}.panel-body{padding:8px;min-height:0}.section-label{font-size:8px;margin-bottom:5px}.elements{grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}.element{padding:5px 4px;min-height:76px;border-radius:8px}.element .symbol{width:100%;height:39px;font-size:28px;margin-bottom:3px}.element .name{font-size:9px}.element .meta{display:none}.element .select-mark{font-size:8px;right:5px;top:4px}.slots{gap:5px;margin:7px 0}.slot{min-height:37px;padding:5px 7px;gap:5px}.slot .slot-icon{font-size:16px}.slot .slot-label{font-size:7px}.slot strong,.slot .slot-placeholder{font-size:9px}.btn{padding:6px 8px;font-size:9px}.result{margin-top:7px;min-height:0}.result-top{padding:8px;gap:8px}.result-icon{width:32px;height:32px;font-size:19px}.result-title{font-size:15px}.result-content{padding:0 8px 8px}.reason{font-size:9px;margin-top:4px}.property-list{gap:3px;margin-top:6px}.property{font-size:8px;padding:2px 4px}.result-note{padding:6px 8px;font-size:8px}.empty-result{padding:10px;font-size:9px}.empty-result .big{font-size:17px;margin-bottom:2px}.history-wrap{margin-top:7px;max-height:62px}.history-head{margin-bottom:4px}.history{max-height:39px;gap:2px}.history-item{padding:3px 5px;font-size:8px}.recipe-list{gap:3px}.recipe{padding:4px 6px;border-radius:6px}.recipe strong{font-size:9px}.recipe small{font-size:8px;margin-top:1px}.recipe .out{font-size:8px}.rule-note{display:none}.footer{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <nav class="topbar">
    <div class="brand"><div class="brand-mark">✳</div><div><div class="brand-title">HAD IT GONE</div></div></div>
    
  </nav>
  <header class="hero">
    <div><h1><span>THE LAB</span></h1></div>
    
  </header>
  <main class="workspace">
    <section class="panel">
      <div class="panel-head"><div class="panel-heading"><div class="panel-icon">⚗</div><div><h2>Experiment chamber</h2></div></div></div>
      <div class="panel-body">
        <div class="section-label">ELEMENTS</div>
        <div id="elements" class="elements"></div>
        <div class="slots">
          <div id="slotA" class="slot"><div><span class="slot-label">Input A</span><span class="slot-placeholder">Select an element</span></div></div>
          <div id="slotB" class="slot"><div><span class="slot-label">Input B</span><span class="slot-placeholder">Select an element</span></div></div>
        </div>
        <div class="actions"><button id="combine" class="btn primary" disabled>✦ &nbsp;Combine elements</button><button id="clear" class="btn">Clear inputs</button><button id="reset" class="btn">Reset history</button></div>
        <div id="result" class="result" aria-live="polite"><div class="empty-result"><span class="big">✧</span><strong>Awaiting inputs</strong><br>Select two elements to reveal the result, mechanism and properties.</div></div>
        <div class="history-wrap"><div class="history-head"><div class="section-label" style="margin:0">HISTORY</div><span id="historyCount" class="counter">0 RUNS</span></div><div id="history" class="history"><div class="muted small">Your experiments will appear here.</div></div></div>
      </div>
    </section>
    <aside class="panel">
      <div class="panel-head"><div class="panel-heading"><div class="panel-icon">⌘</div><div><h2>Recipe index</h2></div></div><div id="recipeCount" class="counter">14 RULES</div></div>
      <div class="panel-body">
        <div id="recipes" class="recipe-list"></div>
        
      </div>
    </aside>
  </main>
  
</div>
<script>
const elements = {
  water:{name:"Water",icon:"💧",category:"material",state:"liquid",color:"#6ee7f9",properties:["fluid","solvent","cooling","moisture-bearing"],description:"A liquid that flows, dissolves some substances, and transfers heat.",origin:"primitive"},
  earth:{name:"Earth",icon:"🪨",category:"material",state:"granular solid",color:"#d5ad7c",properties:["mineral","particulate","fragmentable","water-retaining"],description:"A broad game primitive representing soil and mineral particles; it is not a single real substance.",origin:"primitive"},
  fire:{name:"Fire",icon:"🔥",category:"process",state:"active process",color:"#ff9b70",properties:["heat","combustion","energy-releasing","transformative"],description:"A heat-releasing process, not a material.",origin:"primitive"},
  air:{name:"Air",icon:"💨",category:"material",state:"gas",color:"#a5baff",properties:["mobile","dispersing","oxygen-bearing","cooling"],description:"A gas mixture that can carry particles and, under suitable conditions, support combustion.",origin:"primitive"},
  flow:{name:"Flow",icon:"🌊",category:"phenomenon",state:"moving liquid",color:"#6ee7f9",properties:["moving","water-driven","transporting"],description:"A sustained movement of water; a game outcome for combining two water sources.",origin:"game"},
  soil:{name:"Soil",icon:"🌱",category:"material",state:"granular solid",color:"#c6a477",properties:["mineral","particulate","water-retaining","growth-supporting"],description:"A consolidated mass of earth particles; a game-level aggregation rule.",origin:"game"},
  blaze:{name:"Blaze",icon:"🔥",category:"process",state:"intense combustion",color:"#ff9b70",properties:["heat","combustion","energy-releasing","intense"],description:"An intensified fire process. This is an explicit game rule, not a reaction between two fires in isolation.",origin:"game"},
  wind:{name:"Wind",icon:"🌬️",category:"phenomenon",state:"moving gas",color:"#a5baff",properties:["mobile","dispersing","cooling","transporting"],description:"Moving air. The recipe represents the game rule that two air sources combine into organized motion.",origin:"game"},
  mud:{name:"Mud",icon:"🟤",category:"material",state:"wet cohesive solid",color:"#c6a477",properties:["wet","cohesive","moldable","mineral"],description:"Water binds fine earth particles into a wet, cohesive mass.",origin:"physical"},
  steam:{name:"Steam",icon:"♨️",category:"material",state:"gas",color:"#9cd5e8",properties:["gaseous","hot","water-derived","heat-carrying"],description:"Water in its gaseous phase, produced when sufficient heat causes vaporization.",origin:"physical"},
  mist:{name:"Mist",icon:"🌫️",category:"phenomenon",state:"droplets suspended in gas",color:"#b9c9dc",properties:["moisture-bearing","dispersed-droplets","visibility-reducing"],description:"Tiny liquid droplets suspended in air; formation requires suitable temperature and humidity.",origin:"conditional"},
  baked_clay:{name:"Baked Clay",icon:"🏺",category:"material",state:"hardened solid",color:"#d99b7e",properties:["mineral","hardened","heat-treated","brittle"],description:"Clay-rich earth hardened by heating; the recipe assumes suitable clay and enough heat.",origin:"conditional"},
  dust:{name:"Dust",icon:"🌪️",category:"material",state:"fine particles",color:"#d2bd98",properties:["particulate","dry","dispersible","mineral"],description:"Fine mineral particles lifted and carried by moving air.",origin:"physical"},
  combustion:{name:"Combustion",icon:"♨️",category:"process",state:"chemical process",color:"#ff9b70",properties:["exothermic","oxygen-dependent","transformative","energy-releasing"],description:"A heat-releasing chemical process supported by oxygen and suitable fuel. The recipe abstracts away the fuel requirement.",origin:"chemical"},
  fired_clay:{name:"Fired Clay",icon:"🧱",category:"material",state:"ceramic solid",color:"#d99b7e",properties:["mineral","hardened","heat-treated","brittle"],description:"Mud or clay-rich material fired under suitable conditions to become a ceramic-like solid.",origin:"conditional"},
  moist_earth:{name:"Moist Earth",icon:"🌧️",category:"material",state:"damp granular solid",color:"#c6a477",properties:["mineral","particulate","moisture-bearing","water-retaining"],description:"Earth particles moistened by condensed water.",origin:"conditional"},
  dust_cloud:{name:"Dust Cloud",icon:"🌫️",category:"phenomenon",state:"airborne particles",color:"#d2bd98",properties:["particulate","dispersed","visibility-reducing"],description:"A moving air mass carrying suspended dust.",origin:"physical"}
};
const recipes = [
{id:"ww",a:"water",b:"water",out:"flow",mechanism:"Aggregation (game rule)",type:"game",conditions:[],why:"The game treats two water sources as a sustained moving flow. Movement is abstracted into the recipe."},
{id:"ee",a:"earth",b:"earth",out:"soil",mechanism:"Aggregation (game rule)",type:"game",conditions:[],why:"Two earth portions form a larger particulate mass. Soil is a game-level result; real soil formation is more complex."},
{id:"ff",a:"fire",b:"fire",out:"blaze",mechanism:"Intensification (game rule)",type:"game",conditions:[],why:"Two fire sources are represented as one more intense burning process. Fire itself is not a material."},
{id:"aa",a:"air",b:"air",out:"wind",mechanism:"Organized motion (game rule)",type:"game",conditions:[],why:"The game turns two air sources into moving air. In reality, wind requires a pressure gradient; this recipe abstracts that cause."},
{id:"we",a:"water",b:"earth",out:"mud",mechanism:"Particle binding",type:"physical",conditions:[],why:"Water wets and binds fine earth particles into a cohesive mass."},
{id:"wf",a:"water",b:"fire",out:"steam",mechanism:"Phase change",type:"physical",conditions:["sufficient heat"],why:"Sufficient heat vaporizes water. The game abstracts away energy quantity and pressure."},
{id:"wa",a:"water",b:"air",out:"mist",mechanism:"Droplet suspension",type:"conditional",conditions:["suitable temperature and humidity"],why:"Mist consists of tiny liquid droplets suspended in air. Water and air alone do not guarantee mist, so the game assumes suitable conditions."},
{id:"ef",a:"earth",b:"fire",out:"baked_clay",mechanism:"Heat treatment",type:"conditional",conditions:["earth contains suitable clay","sufficient heat"],why:"Clay-rich earth can harden when heated. Ordinary soil or rock will not always produce baked clay."},
{id:"ea",a:"earth",b:"air",out:"dust",mechanism:"Particle dispersal",type:"physical",conditions:["earth contains fine, dry particles","air is moving"],why:"Moving air can lift and carry fine dry mineral particles."},
{id:"fa",a:"fire",b:"air",out:"combustion",mechanism:"Combustion support",type:"chemical",conditions:["suitable fuel is present"],why:"Oxygen in air supports combustion, but air and fire alone are not a complete chemical recipe; fuel is implicit in this game abstraction."},
{id:"mf",a:"mud",b:"fire",out:"fired_clay",mechanism:"Drying and firing",type:"conditional",conditions:["mud contains suitable clay","sufficient heat"],why:"Clay-rich mud can be dried and fired into a ceramic-like material under suitable conditions."},
{id:"sd",a:"steam",b:"earth",out:"moist_earth",mechanism:"Condensation",type:"conditional",conditions:["earth surface is cooler than the steam"],why:"Steam can condense on a cooler earth surface and leave it damp."},
{id:"dw",a:"dust",b:"water",out:"mud",mechanism:"Particle binding",type:"physical",conditions:["enough water for the quantity of dust"],why:"Water binds fine mineral dust into mud when there is enough moisture."},
{id:"du",a:"dust",b:"wind",out:"dust_cloud",mechanism:"Particle transport",type:"physical",conditions:["wind is strong enough to carry dust"],why:"Wind suspends and transports fine particles, creating a dust cloud."}
];
const $ = id => document.getElementById(id);
let selected=[],history=[];
const typeLabels={physical:"Physical rule",chemical:"Chemical rule",conditional:"Conditional rule",game:"Game rule"};
function renderElements(){
  $("elements").innerHTML=Object.entries(elements).map(([id,e])=>`<button class="element ${selected.includes(id)?"selected":""}" style="--element-color:${e.color}" data-id="${id}"><span class="select-mark">●</span><span class="symbol">${e.icon}</span><span class="name">${e.name}</span><span class="meta">${e.category}</span></button>`).join("");
  document.querySelectorAll(".element").forEach(btn=>btn.addEventListener("click",()=>selectElement(btn.dataset.id)));
}
function selectElement(id){if(selected.length<2)selected.push(id);else selected=[selected[1],id];renderElements();renderSlots();$("combine").disabled=selected.length!==2}
function renderSlots(){["slotA","slotB"].forEach((slot,i)=>{const id=selected[i],el=$(slot);if(id){const e=elements[id];el.classList.add("filled");el.innerHTML=`<span class="slot-icon">${e.icon}</span><div><span class="slot-label">Input ${i===0?"A":"B"}</span><strong>${e.name}</strong></div>`}else{el.classList.remove("filled");el.innerHTML=`<div><span class="slot-label">Input ${i===0?"A":"B"}</span><span class="slot-placeholder">Select an element</span></div>`}})}
function pairKey(a,b){return [a,b].sort().join("|")}
function findRecipe(a,b){return recipes.find(r=>pairKey(r.a,r.b)===pairKey(a,b))}
function showResult(outId,recipe,inputs){const e=elements[outId];$("result").innerHTML=`<div class="result-top"><div class="result-icon">${e.icon}</div><div><div class="result-title">${e.name}</div><div class="pills"><span class="pill">${e.category}</span><span class="pill ${recipe.type}">${typeLabels[recipe.type]||recipe.type}</span></div></div></div><div class="result-content"><div class="reason"><strong>Mechanism:</strong> ${recipe.mechanism}</div><div class="reason">${recipe.why}</div><div class="property-list">${e.properties.map(p=>`<span class="property">${p}</span>`).join("")}</div></div>${recipe.conditions.length?`<div class="result-note"><strong>Assumed conditions:</strong> ${recipe.conditions.join("; ")}.</div>`:""}<div class="result-note">${e.description}</div>`;history.unshift(`${elements[inputs[0]].name} + ${elements[inputs[1]].name} → ${e.name}`);renderHistory()}
function combine(){if(selected.length!==2)return;const[a,b]=selected,recipe=findRecipe(a,b);if(!recipe){$("result").innerHTML='<div class="empty-result"><span class="big">⌁</span><strong>Recipe not defined</strong><br>This pair has no explicit rule yet. The lab will not invent a name to fill the gap.</div>';return}showResult(recipe.out,recipe,[a,b])}
function renderRecipes(){$("recipes").innerHTML=recipes.map(r=>`<div class="recipe"><button data-recipe="${r.id}"><strong>${elements[r.a].name} <span class="arrow">+</span> ${elements[r.b].name}</strong><small>${r.mechanism}</small></button><span class="out">→ ${elements[r.out].name}</span></div>`).join("");document.querySelectorAll("[data-recipe]").forEach(btn=>btn.addEventListener("click",()=>{const r=recipes.find(x=>x.id===btn.dataset.recipe);selected=[r.a,r.b];renderElements();renderSlots();$("combine").disabled=false;combine();window.scrollTo({top:0,behavior:"smooth"})}))}
function renderHistory(){$("historyCount").textContent=`${history.length} RUN${history.length===1?"":"S"}`;$("history").innerHTML=history.length?history.slice(0,10).map((x,i)=>`<div class="history-item"><span class="history-index">${String(history.length-i).padStart(2,"0")}</span><span>${x}</span></div>`).join(""):'<div class="muted small">Your experiments will appear here.</div>'}
$("combine").addEventListener("click",combine);
$("clear").addEventListener("click",()=>{selected=[];renderElements();renderSlots();$("combine").disabled=true;$("result").innerHTML='<div class="empty-result"><span class="big">✧</span><strong>Awaiting inputs</strong><br>Select two elements to reveal the result, mechanism and properties.</div>'});
$("reset").addEventListener("click",()=>{history=[];renderHistory();selected=[];renderElements();renderSlots();$("combine").disabled=true;$("result").innerHTML='<div class="empty-result"><span class="big">✧</span><strong>History cleared</strong><br>The recipe index remains available.</div>'});
$("elementCount").textContent=Object.keys(elements).length;$("recipeCount").textContent=`${recipes.length} RULES`;
renderElements();renderSlots();renderRecipes();
</script>
</body>
</html>
